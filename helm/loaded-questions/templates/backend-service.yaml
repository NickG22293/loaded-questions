apiVersion: v1
kind: Service
metadata:
  name: {{ include "loaded-questions.fullname" . }}-backend
  labels:
    {{- include "loaded-questions.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "loaded-questions.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
