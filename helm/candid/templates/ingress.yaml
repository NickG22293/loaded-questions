apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "candid.fullname" . }}
  labels:
    {{- include "candid.labels" . | nindent 4 }}
  annotations:
    # Disable response buffering so SSE events are streamed to clients
    # immediately rather than held until nginx's buffer fills.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    # Extend timeouts to keep SSE connections alive indefinitely.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # Use HTTP/1.1 so the backend can hold open chunked SSE responses.
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # /api must be listed first; nginx ingress matches by longest prefix.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "candid.fullname" . }}-backend
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "candid.fullname" . }}-frontend
                port:
                  name: http
